name: e2e

# Deploys the full stack on the runner (the runner plays the role of the VM),
# checks that a second run changes nothing, and tests the OIDC login flow.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install pinned toolchain
        run: |
          pip install -r ../requirements-dev.txt
          ansible-galaxy collection install -r requirements.yml

      - name: Lint (production profile)
        run: ansible-lint

      - name: Build nginx image
        working-directory: .
        run: docker build -t nginx-kc-auth:ci nginx/

      - name: Deploy
        run: >
          ansible-playbook -i localhost, -c local playbook.yml
          -e nginx_image=nginx-kc-auth -e nginx_image_tag=ci

      - name: Deploy again (must report no changes)
        run: |
          ansible-playbook -i localhost, -c local playbook.yml \
            -e nginx_image=nginx-kc-auth -e nginx_image_tag=ci | tee second-run.log
          grep -Eq 'changed=0 +unreachable=0 +failed=0' second-run.log \
            || { echo "::error::Second run was not idempotent, see PLAY RECAP above"; exit 1; }

      - name: OIDC login test
        working-directory: .
        run: tests/e2e.sh

      - name: Container logs
        if: failure()
        run: sudo docker compose --project-directory /opt/cloud-auth-demo logs --no-color
