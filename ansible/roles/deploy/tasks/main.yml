---
- name: Refuse local-only default secrets on a public hostname
  ansible.builtin.assert:
    that:
      - keycloak_admin_password not in deploy_insecure_defaults
      - kc_client_secret not in deploy_insecure_defaults
      - kc_test_user_password not in deploy_insecure_defaults
      - postgres_password not in deploy_insecure_defaults
    fail_msg: >-
      Default secrets are for local runs only. Set KEYCLOAK_ADMIN_PASSWORD,
      KC_CLIENT_SECRET, KC_TEST_USER_PASSWORD and POSTGRES_PASSWORD.
    quiet: true
  when: public_hostname not in ['localhost', '127.0.0.1']

- name: Ensure docker python SDK present
  ansible.builtin.apt:
    name: python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check if docker CLI exists
  ansible.builtin.command: which docker
  register: deploy_docker_cli
  changed_when: false
  failed_when: false

- name: Install Docker
  when: deploy_docker_cli.rc != 0
  block:
    - name: Install Docker repo prereqs
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present

    - name: Map architecture for Docker repo
      ansible.builtin.set_fact:
        deploy_docker_arch: >-
          {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], 'amd64') }}

    - name: Add Docker APT repo (Ubuntu)
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ deploy_docker_arch }}"
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Create project dir
  ansible.builtin.file:
    path: "{{ project_dir }}"
    state: directory
    mode: "0755"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ project_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start DB + Keycloak (compose v2)
  community.docker.docker_compose_v2:
    project_name: "{{ compose_project_name }}"
    project_src: "{{ project_dir }}"
    services:
      - postgres
      - keycloak
    state: present

- name: Wait for Keycloak to become ready
  block:
    - name: Poll Keycloak readiness endpoint
      ansible.builtin.uri:
        url: "{{ keycloak_local_url }}/health/ready"
        status_code: 200
      register: deploy_kc_ready
      until: deploy_kc_ready.status == 200
      retries: 60
      delay: 5
  rescue:
    - name: Read Keycloak logs
      ansible.builtin.command: docker compose --project-directory {{ project_dir }} logs keycloak
      register: deploy_kc_logs
      changed_when: false
      failed_when: false
    - name: Print Keycloak logs
      ansible.builtin.debug:
        var: deploy_kc_logs.stdout_lines
    - name: Abort deployment
      ansible.builtin.fail:
        msg: Keycloak did not become ready within 5 minutes, see logs above.

- name: Bootstrap Keycloak
  ansible.builtin.import_tasks: keycloak.yml

- name: Render nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ project_dir }}/nginx.conf"
    mode: "0644"
  notify: Restart nginx

- name: Verify nginx.conf is a file
  ansible.builtin.stat:
    path: "{{ project_dir }}/nginx.conf"
  register: deploy_nginx_conf_stat

- name: Fail if nginx.conf is not a regular file
  ansible.builtin.fail:
    msg: "Expected {{ project_dir }}/nginx.conf to be a regular file, but it is a directory."
  when: not deploy_nginx_conf_stat.stat.isreg

- name: Start nginx
  community.docker.docker_compose_v2:
    project_name: "{{ compose_project_name }}"
    project_src: "{{ project_dir }}"
    services:
      - nginx
    state: present
