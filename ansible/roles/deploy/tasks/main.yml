---
- name: Ensure docker python SDK present
  ansible.builtin.apt:
    name: python3-docker
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Check if docker CLI exists
  ansible.builtin.command: which docker
  register: deploy_docker_cli
  changed_when: false
  failed_when: false

- name: Install Docker
  when: deploy_docker_cli.rc != 0
  block:
    - name: Install Docker repo prereqs
      ansible.builtin.apt:
        name:
          - ca-certificates
          - python3-debian
        state: present

    - name: Map architecture for Docker repo
      ansible.builtin.set_fact:
        deploy_docker_arch: >-
          {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_facts['architecture'], 'amd64') }}

    - name: Add Docker APT repo (Ubuntu)
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"
        components: stable
        architectures: "{{ deploy_docker_arch }}"
        signed_by: https://download.docker.com/linux/ubuntu/gpg

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker service is enabled and running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

- name: Create project dir
  ansible.builtin.file:
    path: "{{ project_dir }}"
    state: directory
    mode: "0755"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ project_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start DB + Keycloak (compose v2)
  community.docker.docker_compose_v2:
    project_name: "{{ compose_project_name }}"
    project_src: "{{ project_dir }}"
    services:
      - postgres
      - keycloak
    state: present

- name: Wait for Keycloak to become ready
  block:
    - name: Poll Keycloak readiness endpoint
      ansible.builtin.uri:
        url: http://127.0.0.1:8080/health/ready
        status_code: 200
      register: deploy_kc_ready
      until: deploy_kc_ready.status == 200
      retries: 60
      delay: 5
  rescue:
    - name: Read Keycloak logs
      ansible.builtin.command: docker compose --project-directory {{ project_dir }} logs keycloak
      register: deploy_kc_logs
      changed_when: false
      failed_when: false
    - name: Print Keycloak logs
      ansible.builtin.debug:
        var: deploy_kc_logs.stdout_lines
    - name: Abort deployment
      ansible.builtin.fail:
        msg: Keycloak did not become ready within 5 minutes, see logs above.

- name: Bootstrap Keycloak realm, client and test user
  module_defaults:
    group/community.general.keycloak:
      auth_client_id: admin-cli
      auth_keycloak_url: http://127.0.0.1:8080
      auth_realm: master
      auth_username: "{{ keycloak_admin }}"
      auth_password: "{{ keycloak_admin_password }}"
  block:
    - name: Ensure realm exists
      community.general.keycloak_realm:
        id: "{{ kc_realm }}"
        realm: "{{ kc_realm }}"
        enabled: true
        state: present

    - name: Ensure OIDC client exists
      community.general.keycloak_client:
        realm: "{{ kc_realm }}"
        client_id: "{{ kc_client_id }}"
        protocol: openid-connect
        public_client: false
        secret: "{{ kc_client_secret }}"
        standard_flow_enabled: true
        direct_access_grants_enabled: true
        redirect_uris:
          - "{{ redirect_origin }}/*"
        web_origins:
          - "{{ redirect_origin }}"
        state: present

    - name: Ensure test user exists
      community.general.keycloak_user:
        realm: "{{ kc_realm }}"
        username: "{{ kc_test_user }}"
        first_name: Demo
        last_name: User
        email: "{{ kc_test_user_email | default(kc_test_user ~ '@example.com') }}"
        email_verified: true
        enabled: true
        credentials:
          - type: password
            value: "{{ kc_test_user_password }}"
            temporary: false
        state: present

- name: Render nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ project_dir }}/nginx.conf"
    mode: "0644"
  notify: Restart nginx

- name: Verify nginx.conf is a file
  ansible.builtin.stat:
    path: "{{ project_dir }}/nginx.conf"
  register: deploy_nginx_conf_stat

- name: Fail if nginx.conf is not a regular file
  ansible.builtin.fail:
    msg: "Expected {{ project_dir }}/nginx.conf to be a regular file, but it is a directory."
  when: not deploy_nginx_conf_stat.stat.isreg

- name: Start nginx
  community.docker.docker_compose_v2:
    project_name: "{{ compose_project_name }}"
    project_src: "{{ project_dir }}"
    services:
      - nginx
    state: present
