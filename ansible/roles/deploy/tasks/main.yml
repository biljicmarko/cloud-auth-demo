---
- name: Ensure docker python SDK present
  ansible.builtin.apt:
    name: python3-docker
    state: present
    update_cache: true

- name: Check if docker CLI exists
  ansible.builtin.command: which docker
  register: docker_cli_check
  ignore_errors: true

- name: Install Docker repo prereqs
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: docker_cli_check.rc != 0
  become: true

- name: Add Docker GPG key
  ansible.builtin.command: >
    bash -lc 'install -m 0755 -d /etc/apt/keyrings &&
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg |
              gpg --dearmor -o /etc/apt/keyrings/docker.gpg &&
              chmod a+r /etc/apt/keyrings/docker.gpg'
  args:
    creates: /etc/apt/keyrings/docker.gpg
  when: docker_cli_check.rc != 0
  become: true

- name: Map architecture for Docker repo
  ansible.builtin.set_fact:
    docker_arch: >-
      {{ {'x86_64': 'amd64', 'aarch64': 'arm64'}.get(ansible_architecture, 'amd64') }}
  when: docker_cli_check.rc != 0

- name: Add Docker APT repo (Ubuntu)
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    mode: "0644"
    content: |
      deb [arch={{ docker_arch }} signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_lsb.codename | default('jammy') }} stable
  when: docker_cli_check.rc != 0
  become: true

- name: Install Docker Engine and Compose plugin
  ansible.builtin.apt:
    update_cache: true
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
  when: docker_cli_check.rc != 0
  become: true

- name: Ensure Docker service is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
  when: docker_cli_check.rc != 0
  become: true

- name: Ensure apt cache (Ubuntu)
  ansible.builtin.apt:
    update_cache: true

- name: Report Docker presence
  ansible.builtin.debug:
    msg: "Docker already present at {{ docker_cli_check.stdout | default('unknown') }}. Skipping install."
  when: docker_cli_check.rc == 0

- name: Create project dir
  ansible.builtin.file:
    path: "{{ project_dir }}"
    state: directory
    mode: "0755"

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ project_dir }}/docker-compose.yml"
    mode: "0644"

- name: Start DB + Keycloak (compose v2)
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    services:
      - postgres
      - keycloak
    state: present
    recreate: always

- name: Wait for Keycloak TCP 8080 to be up
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 8080
    delay: 2
    timeout: 900
  become: false

- block:
    - name: Wait for Keycloak OIDC discovery
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/realms/master/.well-known/openid-configuration"
        status_code: 200
      register: kc_health
      retries: 120
      delay: 5
      until: kc_health.status == 200
  rescue:
    - name: Show Keycloak logs on failure
      ansible.builtin.command: docker logs z-task-keycloak-1
      ignore_errors: true
      register: kc_logs
    - ansible.builtin.debug:
        var: kc_logs.stdout
    - ansible.builtin.fail:
        msg: "Keycloak did not become ready in time. See logs above."

- name: Wait for Keycloak TCP 8080 to be up
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: 8080
    delay: 2
    timeout: 900

- block:
    - name: Wait for Keycloak readiness (deep)
      ansible.builtin.uri:
        url: "http://127.0.0.1:8080/health/ready"
        status_code: 200
      register: kc_ready
      retries: 120
      delay: 5
      until: kc_ready.status == 200
  rescue:
    - name: Show Keycloak logs on failure
      ansible.builtin.command: docker logs z-task-keycloak-1
      ignore_errors: true
      register: kc_logs
    - ansible.builtin.debug: var=kc_logs.stdout
    - ansible.builtin.fail: msg="Keycloak not ready in time (see logs above)."

- name: Bootstrap Keycloak realm, client and test user
  module_defaults:
    group/community.general.keycloak:
      auth_client_id: admin-cli
      auth_keycloak_url: http://127.0.0.1:8080
      auth_realm: master
      auth_username: "{{ keycloak_admin }}"
      auth_password: "{{ keycloak_admin_password }}"
  block:
    - name: Ensure realm exists
      community.general.keycloak_realm:
        id: "{{ kc_realm }}"
        realm: "{{ kc_realm }}"
        enabled: true
        state: present

    - name: Ensure OIDC client exists
      community.general.keycloak_client:
        realm: "{{ kc_realm }}"
        client_id: "{{ kc_client_id }}"
        protocol: openid-connect
        public_client: false
        secret: "{{ kc_client_secret }}"
        standard_flow_enabled: true
        direct_access_grants_enabled: true
        redirect_uris:
          - "{{ redirect_origin }}/*"
        web_origins:
          - "{{ redirect_origin }}"
        state: present

    - name: Ensure test user exists
      community.general.keycloak_user:
        realm: "{{ kc_realm }}"
        username: "{{ kc_test_user }}"
        first_name: Demo
        last_name: User
        email: "{{ kc_test_user_email | default(kc_test_user ~ '@example.com') }}"
        email_verified: true
        enabled: true
        credentials:
          - type: password
            value: "{{ kc_test_user_password }}"
            temporary: false
        state: present

- name: Render nginx.conf
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ project_dir }}/nginx.conf"
    mode: "0644"

- name: Verify nginx.conf is a file
  ansible.builtin.stat:
    path: "{{ project_dir }}/nginx.conf"
  register: nginx_conf_stat

- name: Fail if nginx.conf is not a regular file
  ansible.builtin.fail:
    msg: "Expected {{ project_dir }}/nginx.conf to be a regular file, but it is a directory."
  when: not nginx_conf_stat.stat.isreg

- name: Start/Reload nginx with new config
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    services:
      - nginx
    state: present
    recreate: always
