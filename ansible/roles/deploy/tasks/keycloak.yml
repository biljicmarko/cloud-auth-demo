---
- name: Bootstrap Keycloak realm, client and test user
  module_defaults:
    group/community.general.keycloak:
      auth_client_id: admin-cli
      auth_keycloak_url: "{{ keycloak_local_url }}"
      auth_realm: master
      auth_username: "{{ keycloak_admin }}"
      auth_password: "{{ keycloak_admin_password }}"
  block:
    - name: Ensure realm exists
      community.general.keycloak_realm:
        id: "{{ kc_realm }}"
        realm: "{{ kc_realm }}"
        enabled: true
        state: present
      register: deploy_kc_realm
      # keycloak_realm compares the raw realm before/after its PUT and always
      # reports a change; only the fields we manage decide "changed" here.
      changed_when: >-
        not deploy_kc_realm.existing or
        deploy_kc_realm.existing.enabled != deploy_kc_realm.proposed.enabled

    - name: Ensure OIDC client exists
      community.general.keycloak_client:
        realm: "{{ kc_realm }}"
        client_id: "{{ kc_client_id }}"
        protocol: openid-connect
        public_client: false
        secret: "{{ kc_client_secret }}"
        standard_flow_enabled: true
        direct_access_grants_enabled: true
        redirect_uris:
          - "{{ redirect_origin }}/*"
        web_origins:
          - "{{ redirect_origin }}"
        state: present

    - name: Ensure test user exists
      community.general.keycloak_user:
        realm: "{{ kc_realm }}"
        username: "{{ kc_test_user }}"
        first_name: Demo
        last_name: User
        email: "{{ kc_test_user_email | default(kc_test_user ~ '@example.com') }}"
        email_verified: true
        enabled: true
        credentials:
          - type: password
            value: "{{ kc_test_user_password }}"
            temporary: false
        state: present
